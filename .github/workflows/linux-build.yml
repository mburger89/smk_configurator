name: Linux Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Install Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          # Must be >= Package.swift's `// swift-tools-version: 6.2` —
          # an older toolchain can't parse the manifest and the job dies
          # before it compiles anything.
          swift-version: "6.2.0"

      - name: Swift version
        run: swift --version

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y clang libhidapi-dev

      - name: Build
        # On Linux `SMKConfigurator` is the UI-free library over Model/ and
        # Device/ (Package.swift's `#else` branch): the app's UI is MetalUI on
        # macOS only for now, so this job is what proves the model and device
        # code build with no UI dependency.
        run: swift build --target SMKConfigurator

      - name: Test
        # The model and device tests (every suite but IconLoaderTests, which
        # needs the macOS app's bundled PNGs).
        run: swift test
