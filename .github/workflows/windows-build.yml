name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run: # bash isn't supported by the Swift setup action on Windows
        shell: pwsh

    steps:
      - uses: actions/checkout@v3

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Setup Swift
        uses: compnerd/gha-setup-swift@v0.3.0
        with:
          # Must be >= Package.swift's `// swift-tools-version: 6.2` —
          # an older toolchain can't parse the manifest and the job dies
          # before it compiles anything.
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Swift version
        run: swift --version

      - name: Compute vcpkg Triplet
        id: triplet
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ runner.arch }}-${{ runner.os }}

      - name: Restore Dependency Cache
        id: cache
        uses: actions/cache/restore@v3
        with:
          path: vcpkg_installed
          key: vcpkg-${{ steps.triplet.outputs.lowercase }}-${{ hashFiles('vcpkg.json') }}

      - name: Install hidapi via vcpkg
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.lowercase }}
        run: vcpkg install

      - name: Save Dependency Cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: vcpkg_installed
          key: vcpkg-${{ steps.triplet.outputs.lowercase }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        # Scoped to SMKConfigurator's own target, not a bare `swift build` —
        # see linux-build.yml's comment for why (avoids building
        # swift-cross-ui's platform-specific sibling backends/dependencies
        # that aren't part of this target's actual dependency closure).
        #
        # PKG_CONFIG_PATH doesn't help here: confirmed via the first real
        # Windows CI run that vcpkg's hidapi port has no .pc file at all, so
        # SPM's systemLibrary pkgConfig resolution silently finds nothing
        # (same failure mode as Ubuntu, different root cause). Set INCLUDE/
        # LIB instead — the standard MSVC-toolchain search-path variables
        # that Swift's Windows clang importer also respects — pointing
        # directly at vcpkg's installed headers/libs.
        run: |
          # DIAGNOSTIC v2. Established so far:
          #   * Not a build error. A deliberate syntax error on this same
          #     step surfaces `error:` lines normally and fails the job, so
          #     the capture path works.
          #   * stderr IS captured (the hidapi pkg-config warning appears).
          #   * The failure produces NO diagnostic whatsoever: the last
          #     SwiftCrossUI source compiles, then ~59s of silence, then
          #     exit 1, never reaching `Emitting module SwiftCrossUI`.
          #   * Free RAM floor in a PASSING run was 8.25GB of 16GB.
          # A silent death during module emission points at the frontend
          # process being killed or crashing. Windows logs that, so ask it.
          $ErrorActionPreference = 'Continue'
          $triplet = "${{ steps.triplet.outputs.lowercase }}"
          $env:INCLUDE = "${{ github.workspace }}\vcpkg_installed\$triplet\include;" + $env:INCLUDE
          $env:LIB = "${{ github.workspace }}\vcpkg_installed\$triplet\lib;" + $env:LIB
          $started = Get-Date

          # 1s sampling: module emission can spike GBs between 5s samples.
          $sampler = Start-Job {
            $min = [double]::MaxValue
            while ($true) {
              $f = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
              if ($f -lt $min) { $min = $f }
              Set-Content -Path "$using:PWD\minfree.txt" -Value ([math]::Round($min,2))
              Start-Sleep -Milliseconds 1000
            }
          }

          swift build --target SMKConfigurator -v 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Stop-Job $sampler; Remove-Job $sampler

          if (Test-Path minfree.txt) { Write-Host "freeRAM minimum during build=$(Get-Content minfree.txt)GB" }
          Write-Host "swift build exit code: $code"

          if ($code -ne 0) {
            Write-Host "===== build.log tail, progress lines removed ====="
            Get-Content build.log | Where-Object { $_ -notmatch '^\[\d+/\d+\]' } | Select-Object -Last 60

            Write-Host "===== last swift-frontend invocation before death ====="
            Get-Content build.log | Where-Object { $_ -match 'swift-frontend|emit-module' } | Select-Object -Last 3

            # The decisive question: did a process crash or get killed?
            Write-Host "===== Windows event log, this step's window ====="
            foreach ($log in @('Application','System')) {
              try {
                Get-WinEvent -FilterHashtable @{LogName=$log; StartTime=$started} -ErrorAction Stop |
                  Where-Object { $_.LevelDisplayName -in @('Error','Critical','Warning') } |
                  Select-Object -First 25 TimeCreated,LevelDisplayName,ProviderName,@{n='Msg';e={$_.Message -replace "`r?`n",' ' }} |
                  Format-List | Out-String -Width 400 | Write-Host
              } catch { Write-Host "no matching events in $log" }
            }
            exit $code
          }
