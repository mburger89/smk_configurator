name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v3

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      # FIX 1: Enable Windows Long Paths to prevent deep swift-frontend temp crashes
      - name: Enable Windows Long Paths
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Setup Swift
        uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Swift version
        run: swift --version

      - name: Compute vcpkg Triplet
        id: triplet
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ runner.arch }}-${{ runner.os }}

      - name: Restore Dependency Cache
        id: cache
        uses: actions/cache/restore@v3
        with:
          path: vcpkg_installed
          key: vcpkg-${{ steps.triplet.outputs.lowercase }}-${{ hashFiles('vcpkg.json') }}

      - name: Install hidapi via vcpkg
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.lowercase }}
        run: vcpkg install

      - name: Save Dependency Cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: vcpkg_installed
          key: vcpkg-${{ steps.triplet.outputs.lowercase }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: |
          $ErrorActionPreference = 'Continue'
          $triplet = "${{ steps.triplet.outputs.lowercase }}"
          $env:INCLUDE = "${{ github.workspace }}\vcpkg_installed\$triplet\include;" + $env:INCLUDE
          $env:LIB = "${{ github.workspace }}\vcpkg_installed\$triplet\lib;" + $env:LIB

          $code = 0
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "--- Compilation Attempt $attempt ---"

            # FIX 3: Avoid piping '2>&1 | Tee-Object'.
            # Redirecting streams into a pipe changes $LASTEXITCODE behavior on crash faults.
            # Instead, run the command cleanly, capture the native code, and dump logs if it fails.
            Start-Process -FilePath "swift" -ArgumentList "build --target SMKConfigurator" -NoNewWindow -Wait -Passthru | Out-Null
            $code = $LASTEXITCODE

            if ($code -eq 0) { break }

            # Clear out the temporary ModuleCache to force a fresh parse if an illegal instruction hit
            Write-Host "Attempt $attempt failed with code $code. Evicting corrupted build caches..."
            if (Test-Path .build\x86_64-unknown-windows-msvc\debug\ModuleCache) {
              Remove-Item -Recurse -Force .build\x86_64-unknown-windows-msvc\debug\ModuleCache
            }

            Write-Host "::warning::swift build died with exit $code on attempt $attempt of 3. Retrying."
          }

          if ($code -ne 0) {
            Write-Host "===== Build failed permanently after 3 attempts with exit code $code ====="
            exit $code
          }

      - name: Build tests
        # Compile the model and device tests (the UI-free library's suites).
        # Running them on Windows is part of the later Linux/Windows item:
        # paths such as homeDirectoryForCurrentUser and UserDefaults suites
        # have never been exercised there.
        run: |
          $triplet = "${{ steps.triplet.outputs.lowercase }}"
          $env:INCLUDE = "${{ github.workspace }}\vcpkg_installed\$triplet\include;" + $env:INCLUDE
          $env:LIB = "${{ github.workspace }}\vcpkg_installed\$triplet\lib;" + $env:LIB
          swift build --build-tests
