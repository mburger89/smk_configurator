name: Windows Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run: # bash isn't supported by the Swift setup action on Windows
        shell: pwsh

    steps:
      - uses: actions/checkout@v3

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Setup Swift
        uses: compnerd/gha-setup-swift@v0.3.0
        with:
          # Must be >= Package.swift's `// swift-tools-version: 6.2` —
          # an older toolchain can't parse the manifest and the job dies
          # before it compiles anything.
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Swift version
        run: swift --version

      - name: Compute vcpkg Triplet
        id: triplet
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ runner.arch }}-${{ runner.os }}

      - name: Restore Dependency Cache
        id: cache
        uses: actions/cache/restore@v3
        with:
          path: vcpkg_installed
          key: vcpkg-${{ steps.triplet.outputs.lowercase }}-${{ hashFiles('vcpkg.json') }}

      - name: Install hidapi via vcpkg
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ steps.triplet.outputs.lowercase }}
        run: vcpkg install

      - name: Save Dependency Cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: vcpkg_installed
          key: vcpkg-${{ steps.triplet.outputs.lowercase }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        # Scoped to SMKConfigurator's own target, not a bare `swift build` —
        # see linux-build.yml's comment for why (avoids building
        # swift-cross-ui's platform-specific sibling backends/dependencies
        # that aren't part of this target's actual dependency closure).
        #
        # PKG_CONFIG_PATH doesn't help here: confirmed via the first real
        # Windows CI run that vcpkg's hidapi port has no .pc file at all, so
        # SPM's systemLibrary pkgConfig resolution silently finds nothing
        # (same failure mode as Ubuntu, different root cause). Set INCLUDE/
        # LIB instead — the standard MSVC-toolchain search-path variables
        # that Swift's Windows clang importer also respects — pointing
        # directly at vcpkg's installed headers/libs.
        run: |
          # DIAGNOSTIC (temporary, see PR): this job fails ~2/3 of the time,
          # always at the same place — every SwiftCrossUI source compiles,
          # then the step exits 1 roughly 40s later with no diagnostic in
          # the log, having never reached `Emitting module SwiftCrossUI`.
          #
          # Exit code 1 is SwiftPM's ordinary "build failed" code; a crash
          # or an OOM kill on Windows surfaces a large NTSTATUS-derived code
          # instead. So the diagnostics almost certainly exist and are being
          # lost before they reach the log. GitHub runs pwsh steps with
          # $ErrorActionPreference = 'Stop', under which a native command
          # writing to stderr can terminate the step and drop the output.
          # Force stderr into stdout and keep going, so whatever swift build
          # is actually saying survives.
          $ErrorActionPreference = 'Continue'
          $triplet = "${{ steps.triplet.outputs.lowercase }}"
          $env:INCLUDE = "${{ github.workspace }}\vcpkg_installed\$triplet\include;" + $env:INCLUDE
          $env:LIB = "${{ github.workspace }}\vcpkg_installed\$triplet\lib;" + $env:LIB

          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "cores=$env:NUMBER_OF_PROCESSORS totalRAM=$([math]::Round($os.TotalVisibleMemorySize/1MB,2))GB freeRAM=$([math]::Round($os.FreePhysicalMemory/1MB,2))GB"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table | Out-String | Write-Host

          # Sample free RAM throughout: a passing run tells us nothing about
          # peak pressure, and if the captured stderr turns out empty we do
          # not want to spend another ~18min cycle to get this number.
          $sampler = Start-Job {
            $min = [double]::MaxValue
            while ($true) {
              $f = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
              if ($f -lt $min) { $min = $f }
              Set-Content -Path "$using:PWD\minfree.txt" -Value ([math]::Round($min,2))
              Start-Sleep -Seconds 5
            }
          }

          swift build --target SMKConfigurator 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE

          Stop-Job $sampler; Remove-Job $sampler
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "swift build exit code: $code"
          Write-Host "freeRAM after=$([math]::Round($os.FreePhysicalMemory/1MB,2))GB"
          if (Test-Path minfree.txt) { Write-Host "freeRAM minimum during build=$(Get-Content minfree.txt)GB" }

          if ($code -ne 0) {
            Write-Host "===== last 150 lines of captured output ====="
            Get-Content build.log -Tail 150
            exit $code
          }
